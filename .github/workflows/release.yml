name: Prepare Release

# Opens a PR bumping the pinned anythingllm-lagoon-base image in
# docker-compose.yml to its newest tag. Merging stays manual; the merge then
# rolls out through lagoon-deploy.yml.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'anythingllm-lagoon-base tag to release (e.g. v1.19.0). Empty = newest tag.'
        required: false
        type: string
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

env:
  BASE_REPO: amazeeio/anythingllm-lagoon-base

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve target version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-$(gh api "repos/$BASE_REPO/tags" --paginate --jq '.[].name' | grep -E '^v[0-9]' | sort -V | tail -1)}"
          CURRENT=$(sed -nE 's#.*anythingllm-lagoon-base:(v[^"[:space:]]+).*#\1#p' docker-compose.yml | head -1)
          echo "Pinned: $CURRENT, target: $VERSION"

          # The base repo pushes its tag before building the image, so only
          # release a tag whose image is already on GHCR.
          TOKEN=$(curl -s "https://ghcr.io/token?scope=repository:$BASE_REPO:pull" | jq -r .token)
          if ! curl -sf -o /dev/null -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/$BASE_REPO/manifests/$VERSION"; then
            echo "::notice::ghcr.io/$BASE_REPO:$VERSION is not published yet; trying again next run."
            VERSION="$CURRENT"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "changed=$([ "$VERSION" != "$CURRENT" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Update docker-compose.yml
        if: steps.resolve.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: sed -i -E "s#(anythingllm-lagoon-base:)v[^\"[:space:]]+#\1${VERSION}#" docker-compose.yml

      # Open the PR as the org's automation GitHub App rather than
      # github.token, so anything that runs on pull requests is triggered.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        if: steps.resolve.outputs.changed == 'true'
        with:
          client-id: ${{ secrets.AMAZEE_AI_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AMAZEE_AI_AUTOMATION_APP_PRIVATE_KEY }}

      - name: Create pull request
        if: steps.resolve.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.app.outputs.token }}
          commit-message: "release: update anythingllm-lagoon-base to ${{ steps.resolve.outputs.version }}"
          branch: release/update-to-${{ steps.resolve.outputs.version }}
          title: "Release: Update to ${{ steps.resolve.outputs.version }}"
          body: |
            Updates the `anythingllm` base image to `${{ steps.resolve.outputs.version }}` in `docker-compose.yml`.

            - **Changes:** https://github.com/${{ env.BASE_REPO }}/compare/${{ steps.resolve.outputs.current }}...${{ steps.resolve.outputs.version }}

            Merge to deploy.
          delete-branch: true
